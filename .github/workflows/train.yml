# .github/workflows/train.yml

name: Train

on:
  workflow_call:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    
    env:
      MLFLOW_TRACKING_URI: file:./mlruns
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r 3-cicd/requirements.txt

      - name: Verify best_config.json exists
        working-directory: 3-cicd
        run: |
          if [ ! -f best_config.json ]; then
            echo "❌ Error: best_config.json not found!"
            exit 1
          fi
          echo "✅ best_config.json found"

      - name: Train model
        working-directory: 3-cicd
        run: |
          python train.py
          echo "✅ Training complete"

      - name: Verify artifact contents
        run: |
          ls -R 3-cicd/models
          cat 3-cicd/run_id.txt

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            3-cicd/run_id.txt
            3-cicd/models/
          retention-days: 7
